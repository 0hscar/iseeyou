[server]
host = "127.0.0.1"
port = 8000

[logging]
level = "INFO"

# RouterOS REST is accessed only over HTTPS. Leave commented until the router
# has www-ssl enabled with a certificate trusted by this host.
# [router]
# host = "router.lan"
# port = 443
# username = "isee-monitor"
# ca_file = "/path/to/router-ca.pem"
# timeout_seconds = 5

[collection]
interval_seconds = 10
database_path = "data/isee.sqlite3"
# Leave empty to collect all interfaces. Avoid adding both a bridge and its
# member ports when interpreting aggregate traffic.
interfaces = []
probes_per_target = 3
probe_timeout_seconds = 2

# Connectivity probes use TCP connection attempts to the configured service.
# Add targets explicitly; they are not contacted by default.
# [[collection.targets]]
# name = "public-https"
# host = "1.1.1.1"
# port = 443
